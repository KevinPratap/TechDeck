name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not paste QR codes, tokens or your OBS password.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PocketDeck version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: input
    id: phone
    attributes:
      label: Phone and browser
      placeholder: "iPhone 15, Safari"
  - type: input
    id: obs
    attributes:
      label: OBS version (if it involves OBS)
      placeholder: "30.2"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of `%USERPROFILE%\.pocketdeck\pocketdeck.log`, if there are any.
      render: text
